# SIMULATED data: every parameter of the Corridor B delay simulator. Defaults from
# reports/phase2b_simulator_design.md, except freight, incident, entry-delay and exit-gap values, which were
# lowered after a first check (see section 12 of the design document). None are calibrated on real delays.
simulation:
  seed: 42
  year: 2025
  warmup_days: 4            # days simulated before a pilot/segment start, output discarded
network:
  cluster_name: PRYG        # ALD, NYN and COI merged into one node
  cluster_stations: [ALD, NYN, COI]
  off_corridor_hop_km: 60   # consecutive core stops further apart than this form a fixed-time leg
movement:
  headway_min: 4
  assume_scheduled_pairs_feasible: true   # pairs the timetable schedules closer than the headway keep their scheduled spacing
  headway_overrides: {}     # section name "NODE_A-NODE_B" -> minutes
  exit_gap_min: 1
  min_halt_factor: 0.5
  yield_window_min: 10
  max_yield_hold_min: 30
  yield_lookback_sections: 1
  overtake_mode: any_station    # any_station | junction_or_halt (the earlier rule, kept for comparison)
  loop_capacity: 2              # any_station mode: max trains held aside per station
  overtake_penalty_min: 2.0     # any_station mode: extra minutes paid by the overtaken train
  yield_min_conflict_min: 1.0   # yield only if letting the slower train go first would delay the priority train by more than this
  priority: {Rajdhani: 1, Duronto: 2, Shatabdi: 2, Superfast: 3, Mail/Express: 4, Passenger: 5, other: 4}
  slack: {Rajdhani: 0.05, Duronto: 0.05, Shatabdi: 0.06, Superfast: 0.06, Mail/Express: 0.07, Passenger: 0.08, other: 0.06}
rake:
  min_turnaround_min: 45
  max_turnaround_hours: 36
  offcorridor_recovery: 0.3
  noise_sd_min: 3
freight:
  rate_per_section_hour: 0.04
  junction_multiplier: 2.5
  congested_nodes: [NDLS, GZB, TDL, CNB, PRYG, MGS]
  duration_median_min: 5
  duration_sigma: 0.6
  yield_priority: 2         # trains with priority <= this are never held by freight
incidents:
  base_rate: 0.002          # per train per section traversal
  junction_factor: 2.0
  node_factor: {NDLS: 2.5, CNB: 2.0, TDL: 1.8, PRYG: 2.0}
  peak_hour_factor: 1.3
  peak_hours: [6, 7, 8, 17, 18, 19, 20]
  month_factor: {1: 1.5, 2: 1.2, 6: 1.2, 7: 1.2, 8: 1.2, 9: 1.2, 11: 1.2, 12: 1.5}
  weather_factor: {clear: 1.0, fog: 2.0, rain: 1.3}
  lognormal_median_min: 5
  lognormal_sigma: 0.9
  tail_probability: 0.05
  pareto_min_min: 15
  pareto_alpha: 1.7
  cap_min: 240
halt_extension:
  probability: 0.02
  lognormal_median_min: 3
  lognormal_sigma: 0.8
  cap_min: 10
weather:
  fog_probability: {11: 0.08, 12: 0.35, 1: 0.40, 2: 0.12}
  rain_probability: {6: 0.10, 7: 0.25, 8: 0.25, 9: 0.25, 10: 0.10}
  rain_default: 0.02
  persistence: 0.6
  fog_slowdown: 0.12
  rain_slowdown: 0.03
  fog_intensity: {to_CNB: 1.0, to_PRYG: 0.5, beyond: 0.2}
entry_delay:
  zero_probability: 0.6
  lognormal_median_min: 8
  lognormal_sigma: 0.8
  journey_fraction_weight: 0.5
  fog_multiplier: 2.5
  type_factor: {Rajdhani: 0.6, Duronto: 0.7, Shatabdi: 0.7, Superfast: 1.0, Mail/Express: 1.1, Passenger: 1.2, other: 1.0}
  cap_min: 360
disruptions:
  rate_per_section_day: 0.0015
  duration_median_min: 70
  duration_sigma: 0.6
  duration_min: 30
  duration_max: 180
  signal_failure_share: 0.6   # one direction closed; the rest are blocks (both directions)
